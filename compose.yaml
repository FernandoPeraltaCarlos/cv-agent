name: agent-cv
services:
  api:
    build: .
    restart: unless-stopped
    init: true
    user: "1001:1001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 96
    mem_limit: 256m
    cpus: 0.5
    environment:
      PUBLIC_HOST: agent-cv.fernandoperalta.xyz
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:1.5b}
      API_KEY_FILE: /run/secrets/api_key
      PROFILE_PATH: /app/data/profile.json
      STATE_PATH: /app/data/state/responses.sqlite3
      ALLOW_DRAFT_PROFILE: ${ALLOW_DRAFT_PROFILE:-false}
      REQUESTS_PER_MINUTE: ${REQUESTS_PER_MINUTE:-20}
      MODEL_TIMEOUT_SECONDS: ${MODEL_TIMEOUT_SECONDS:-45}
      RESPONSE_TTL_SECONDS: ${RESPONSE_TTL_SECONDS:-86400}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-[]}
    secrets: [api_key]
    volumes:
      - ./data/profile.json:/app/data/profile.json:ro
      - state:/app/data/state
    tmpfs:
      - /tmp:size=16m,mode=1777
    networks: [private]
    depends_on:
      ollama:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  gateway:
    image: haproxy:3.2-alpine@sha256:5893840576071e6217cd52ebdcc14f454c6f7a631056fa6f4e0f40d3cac4215b
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 32
    mem_limit: 64m
    cpus: 0.25
    ports:
      - "127.0.0.1:${API_PORT:-8011}:8000"
    volumes:
      - ./deploy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    tmpfs:
      - /tmp:size=8m,mode=1777
    networks: [private, ingress]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8000/healthz]
      interval: 15s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  ollama:
    build:
      context: .
      dockerfile: Dockerfile.ollama
    restart: unless-stopped
    init: true
    user: "1001:1001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 2g
    cpus: 3
    environment:
      OLLAMA_MODELS: /models
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:1.5b}
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_NOHISTORY: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_MAX_QUEUE: "1"
      OLLAMA_CONTEXT_LENGTH: "4096"
      OLLAMA_KEEP_ALIVE: "5m"
    volumes:
      - models:/models
    tmpfs:
      - /tmp:size=128m,mode=1777
      - /home/agent/.ollama:size=1m,uid=1001,gid=1001,mode=0700
    networks: [private]
    healthcheck:
      test: [CMD, ollama, list]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

secrets:
  api_key:
    file: ./.secrets/api_key
volumes:
  models:
  state:
networks:
  private:
    internal: true
  ingress: {}
