global
    maxconn 32
    nbthread 1

defaults
    mode http
    timeout connect 5s
    timeout client 60s
    timeout server 60s
    timeout http-request 15s

resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 10s

frontend local_api
    bind :8000
    default_backend cv_api

backend cv_api
    server api api:8000 check resolvers docker init-addr libc,none
